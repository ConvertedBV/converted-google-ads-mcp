# tools_config.yaml
#
# Tools configuration for the Google Ads MCP server.
# Modify this file to enable/disable tool namespaces or set custom prefixes.

namespaces:
  customers: true
  search: true
  metadata: true
  labels: true
  assets: true
  # Converted: status, budget, bid and keyword management (propose & confirm).
  campaign_management: true
  # Converted: build new Search campaigns, ad groups and ads (atomic).
  campaign_builder: true
  # Converted: Keyword Planner ideas, metrics and forecasts (read-only).
  keyword_planning: true
  # Converted: conversion tracking overview, actions and goals.
  conversions: true
  # Converted: remarketing lists, audience targeting, demographic exclusions.
  audiences: true
  # Converted: campaign experiments (A/B tests).
  experiments: true
  # Converted: account overview with flags (read-only).
  account: true
  # Converted: Google Analytics 4 (Data + Admin API). Only mounted when the
  # environment variable GOOGLE_ADS_MCP_ANALYTICS is 'read' (the first three)
  # or 'full' (all four); off by default.
  analytics_reporting: true
  analytics_insights: true
  analytics_admin: true
  analytics_management: true
